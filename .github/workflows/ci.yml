name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, ASan + UBSan
            os: ubuntu-latest
            cmake_args: -DA2DP_XQ_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          - name: macOS
            os: macos-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test -B build/test ${{ matrix.cmake_args }} -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build/test --parallel
      - name: Test
        run: ctest --test-dir build/test --output-on-failure

  source-checks:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every source file starts with an SPDX line
        run: |
          bad=0
          for f in $(git ls-files 'src/*.c' 'src/*.h' 'test/*.c' 'test/*.h' 'examples/*.c' 'examples/*.ino'); do
            head -1 "$f" | grep -q 'SPDX-License-Identifier: Apache-2.0' || { echo "missing SPDX line: $f"; bad=1; }
          done
          exit $bad

  esp-idf:
    name: ESP-IDF ${{ matrix.idf }} ${{ matrix.target }} ${{ matrix.example }}
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.3, release-v5.5, release-v6.0, release-v6.1]
        target: [esp32]
        example: [sine_to_headphones, codec_report]
        include:
          # No Bluetooth Classic on the S3: the library must still build (and report unsupported).
          - idf: release-v6.1
            target: esp32s3
            example: sine_to_headphones
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd examples/idf/${{ matrix.example }}
          idf.py set-target ${{ matrix.target }}
          idf.py build 2>&1 | tee build.log
          ! grep -E "warning:" build.log | grep -E "esp32-a2dp-xq|/main/"

  arduino:
    name: Arduino ${{ matrix.core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["3.1.3", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples/arduino
          cli-compile-flags: |
            - --warnings
            - all

  platformio:
    name: PlatformIO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build the Arduino examples
        run: |
          for sketch in examples/arduino/*/*.ino; do
            pio ci "$sketch" --lib . --board esp32dev \
              -O "platform=https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip" \
              -O "build_flags=-Wall -Wextra"
          done
