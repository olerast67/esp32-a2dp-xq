name=esp32-a2dp-xq
version=0.1.0
author=olerast67
maintainer=olerast67
sentence=ESP32 Bluetooth A2DP source with SBC-XQ: 452 kbps Dual Channel SBC to headphones, with fallback to standard SBC.
paragraph=Sends audio from an ESP32 to Bluetooth headphones and speakers. Negotiates SBC-XQ (Dual Channel, bitpool 38) when the headphones accept it and remembers the result per device; PSRAM FIFO with TPDF dither from 24/32-bit; AVRCP buttons and absolute volume; discovery, pairing and reconnect. SBC-XQ needs ESP-IDF 6.0+; with the Arduino core 3.x the library runs standard SBC.
category=Communication
